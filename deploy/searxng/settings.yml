# SearXNG settings for AgentFlow
# Docs: https://docs.searxng.org/admin/settings/

use_default_settings: true

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  secret_key: "agentflow-searxng-change-in-production"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false  # We control rate limiting at the app level
  image_proxy: false
  # Enable JSON API (required for programmatic access)
  method: "GET"

ui:
  static_use_hash: true

engines:
  # Remove engines that require API keys for self-hosted use
  - name: duckduckgo
    disabled: false
  - name: wikipedia
    disabled: false
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: brave
    disabled: false

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  useragent_suffix: ""
  # Proxy settings (leave empty for direct access)
  proxies: {}
